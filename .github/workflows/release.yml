name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/docker-restart-policy-guard-linux-amd64 -ldflags="-s -w"
          chmod +x dist/docker-restart-policy-guard-linux-amd64

      - name: Build Linux ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build -o dist/docker-restart-policy-guard-linux-arm64 -ldflags="-s -w"
          chmod +x dist/docker-restart-policy-guard-linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/docker-restart-policy-guard-linux-amd64
            dist/docker-restart-policy-guard-linux-arm64
          generate_release_notes: true
